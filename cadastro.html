<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONG Transformar - Cadastro de Voluntário</title>
  <!-- Vínculo com o arquivo de estilos CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header-container">
    <h1>ONG Transformar</h1>
    <nav class="nav-menu">
      <a href="index.html">Início</a> | 
      <a href="cadastro.html">Quero ser Voluntário</a>
    </nav>
  </header>

  <main class="hero-section">
    <h2>Cadastro de Voluntário</h2>
    
    <form class="form-group-container" action="#" method="post">
      
      <!-- Agrupamento 1: Dados Pessoais -->
      <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="cpf">CPF:</label><br>
        <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" maxlength="14" required><br><br>

        <label for="telefone">Telefone:</label><br>
        <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\)\s\d{4,5}-\d{4}" placeholder="(11) 99999-9999" required><br><br>

        <label for="nascimento">Data de Nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento" required><br><br>
      </fieldset>

      <!-- Agrupamento 2: Endereço -->
      <fieldset>
        <legend>Endereço</legend>

        <label for="cep">CEP:</label><br>
        <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" maxlength="9" required><br><br>

        <label for="logradouro">Logradouro:</label><br>
        <input type="text" id="logradouro" name="logradouro" required><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" required><br><br>

        <label for="estado">Estado (UF):</label><br>
        <select id="estado" name="estado" required>
          <option value="">Selecione...</option>
          <option value="SP">São Paulo</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="MG">Minas Gerais</option>
          <option value="DF">Distrito Federal</option>
        </select><br><br>
      </fieldset>

      <!-- Agrupamento 3: Perfil -->
      <fieldset>
        <legend>Perfil de Voluntariado</legend>

        <p>Área de interesse:</p>
        <input type="radio" id="meio-ambiente" name="area" value="meio-ambiente" required>
        <label for="meio-ambiente">Meio Ambiente</label><br>

        <input type="radio" id="educacao" name="area" value="educacao">
        <label for="educacao">Educação</label><br><br>
      </fieldset>

      <button type="submit">Enviar Cadastro</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 ONG Transformar. Todos os direitos reservados.</p>
  </footer>

</body>
</html>
